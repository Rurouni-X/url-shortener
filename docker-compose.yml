version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: url-shortener
    environment:
      POSTGRES_DB: url
      POSTGRES_USER: url-shortener
      POSTGRES_PASSWORD: pass
    ports: 
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: